<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acceso • Portafolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-wrap">
    <a href="index.html" class="auth-back">← Volver al inicio</a>
    <div class="login-card">
      <div class="brand muted">Portafolio<span style="color:var(--teal)">•</span></div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-pane="login" type="button">Iniciar sesión</button>
        <button class="auth-tab" data-pane="register" type="button">Crear cuenta</button>
      </div>

      <!-- LOGIN -->
      <form id="pane-login">
        <div class="auth-row"><label for="li-email">Correo</label>
          <input id="li-email" type="email" autocomplete="email" placeholder="tu@correo.com" required /></div>
        <div class="auth-row"><label for="li-pass">Contraseña</label>
          <input id="li-pass" type="password" autocomplete="current-password" placeholder="••••••••" required /></div>
        <button id="btn-login" type="submit" style="width:100%">Entrar</button>
        <div style="margin-top:10px"><button class="link-muted" id="btn-forgot" type="button">¿Olvidaste tu contraseña?</button></div>
        <p id="login-msg" class="msg"></p>
      </form>

      <!-- REGISTRO -->
      <form id="pane-register" class="hidden">
        <div class="auth-row"><label for="rg-name">Nombre</label>
          <input id="rg-name" type="text" autocomplete="name" placeholder="Tu nombre" /></div>
        <div class="auth-row"><label for="rg-email">Correo</label>
          <input id="rg-email" type="email" autocomplete="email" placeholder="tu@correo.com" required /></div>
        <div class="auth-row"><label for="rg-pass">Contraseña (mín. 6 caracteres)</label>
          <input id="rg-pass" type="password" autocomplete="new-password" placeholder="••••••••" required /></div>
        <div class="auth-row"><label for="rg-pass2">Repite la contraseña</label>
          <input id="rg-pass2" type="password" autocomplete="new-password" placeholder="••••••••" required /></div>
        <button id="btn-register" type="submit" class="teal" style="width:100%">Crear cuenta</button>
        <p id="register-msg" class="msg"></p>
      </form>

      <!-- NUEVA CONTRASEÑA (recuperación) -->
      <form id="pane-recovery" class="hidden">
        <p class="section-sub" style="margin:0 0 14px">Define tu nueva contraseña.</p>
        <div class="auth-row"><label for="rc-pass">Nueva contraseña (mín. 6 caracteres)</label>
          <input id="rc-pass" type="password" autocomplete="new-password" placeholder="••••••••" required /></div>
        <button id="btn-recovery" type="submit" style="width:100%">Guardar contraseña</button>
        <p id="recovery-msg" class="msg"></p>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
